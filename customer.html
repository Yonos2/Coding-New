<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - NEGOSYO KO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/customer.css"> <!-- Custom CSS para sa dugang styles -->
</head>
<body>
    <!-- Navbar nga naay Shopee-style -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(-180deg, #f53d2d, #f63);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/customer.html">NEGOSYO KO</a>
            <div class="d-flex align-items-center">
                <a href="/orders.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-bag-check"></i> My Purchases
                </a>
                <a href="/cart.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-cart"></i> Cart
                </a>
                <a href="/profile.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-person-circle"></i> Profile
                </a>
                <button id="customer-logout-btn" class="btn btn-light">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <h2 class="mb-4" style="color: #333; font-weight: 600;">All Products</h2>
        <div id="customer-product-list" class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-3">
            <!-- Loading state -->
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading products...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/customer.js"></script>
</body>
</html>
