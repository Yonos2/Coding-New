<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEGOSYO KO - Online Shopping</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Custom styles to complement Bootstrap */
        body {
            background-color: #f5f5f5;
        }
        .section-title {
            background-color: white;
            padding: 1rem;
            margin-bottom: 1rem;
            border-bottom: 4px solid #ee4d2d;
            text-transform: uppercase;
            font-weight: 700;
            color: #ee4d2d;
        }
        .product-card {
            font-size: 0.85rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .product-card .card-title {
            font-size: 0.9rem;
            font-weight: 500;
            height: 2.7rem; /* Fixed height for 2 lines */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-card .card-text.price {
            color: #ee4d2d;
            font-weight: 600;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(-180deg, #f53d2d, #f63);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">NEGOSYO KO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/signup.html">Sign Up</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin_login.html">Seller Centre</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container-fluid bg-white text-center py-4 mb-4 border-bottom">
        <h1 class="display-5" style="color: #ee4d2d;">Welcome to NEGOSYO KO</h1>
        <p class="lead">Quality You Can Trust. PALIT NA!!</p>
    </div>

    <!-- Main Content -->
    <main class="container">
        <h2 class="section-title">DAILY DISCOVER</h2>
        <div id="product-list" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
            <!-- Loading state -->
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading products...</p>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const productList = document.getElementById('product-list');
            // Mas robust nga paagi: Kung ang port dili 3000 (backend port), gamita ang full URL.
            // Kini mo-work bisan unsa pa ang port sa Live Server (e.g., 5500, 5501).
            const BASE_URL = window.location.port !== '3000' ? 'http://localhost:3000' : '';

            try {
                const response = await fetch(`${BASE_URL}/api/products`);
                if (!response.ok) throw new Error('Failed to fetch products');
                const result = await response.json();
                const products = result.products;

                productList.innerHTML = '';
                if (!products || products.length === 0) {
                    productList.innerHTML = '<div class="col-12"><p class="text-center">No products found.</p></div>';
                    return;
                }

                products.forEach(product => {
                    const productCol = document.createElement('div');
                    // Using Bootstrap's column classes directly
                    productCol.className = 'col'; 

                    productCol.innerHTML = `
                        <div class="card h-100 product-card">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text price mb-2">₱${Number(product.price).toFixed(2)}</p>
                                <div class="d-flex justify-content-between align-items-center text-muted mt-auto">
                                    <small>${product.brand || 'No Brand'}</small>
                                    <small>Stock: ${product.stock}</small>
                                </div>
                            </div>
                            <div class="card-footer p-1">
                                <button class="btn btn-danger w-100 btn-sm" onclick="window.location.href='/login.html'">Buy Now</button>
                            </div>
                        </div>
                    `;
                    productList.appendChild(productCol);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                productList.innerHTML = '<div class="col-12"><p class="text-center text-danger">Failed to load products.</p></div>';
            }
        });
    </script>
</body>
</html>
