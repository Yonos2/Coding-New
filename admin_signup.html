<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css"> <!-- Giilisan ang CSS file -->
</head>
<body>
    <div class="login-container"> <!-- Giilisan ang class name -->
        <h1>Create Admin Account</h1>
        <p class="form-description">Fill out the form below to create a new admin account.</p>
        <form id="admin-signup-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="button">Create Account</button>
        </form>
        <p id="signup-message"></p>
        <p class="form-footer">Already have an account? <a href="/admin_login.html">Back to Login</a></p>
    </div>
    <script src="/admin_signup.js"></script>
</body>
</html>
