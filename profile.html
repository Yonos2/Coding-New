<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile - NEGOSYO KO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f5f5f5; }
        .card-header {
            background-color: #fff;
            border-bottom: 2px solid #f53d2d;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(-180deg, #f53d2d, #f63);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/customer.html">NEGOSYO KO</a>
            <div class="d-flex align-items-center">
                <a href="/orders.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-bag-check"></i> My Purchases
                </a>
                <a href="/cart.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-cart"></i> Cart
                </a>
                <a href="/profile.html" class="btn btn-outline-light active me-2">
                    <i class="bi bi-person-circle"></i> Profile
                </a>
                <button id="customer-logout-btn" class="btn btn-light">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <div class="card">
            <div class="card-header py-3">
                <h4 class="mb-0">My Profile</h4>
                <p class="text-muted mb-0 small">Manage and protect your account</p>
            </div>
            <div class="card-body p-4">
                <div id="profile-message" class="mb-3"></div>
                <form id="profile-form">
                    <div class="row g-3">
                        <div class="col-md-6"><label for="name" class="form-label">Full Name</label><input type="text" id="name" name="name" class="form-control" required></div>
                        <div class="col-md-6"><label for="email" class="form-label">Email Address</label><input type="email" id="email" name="email" class="form-control" readonly></div>
                        <div class="col-md-6"><label for="phone" class="form-label">Phone Number</label><input type="tel" id="phone" name="phone" class="form-control"></div>
                        <div class="col-md-6"><label for="address" class="form-label">Address</label><input type="text" id="address" name="address" class="form-control"></div>
                        <hr class="my-4">
                        <h5 class="mb-3">Membership & Preferences</h5>
                        <div class="col-md-6"><label for="membership" class="form-label">Membership Level</label><input type="text" id="membership" name="membership" class="form-control" placeholder="e.g., Bronze, Silver, Gold"></div>
                        <div class="col-md-6"><label for="favorite_category" class="form-label">Favorite Category</label><input type="text" id="favorite_category" name="favorite_category" class="form-control" placeholder="e.g., Gadgets, Fashion"></div>
                        <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="likes_promos" id="likes_promos"><label class="form-check-label" for="likes_promos">I want to receive marketing promos and updates.</label></div></div>
                        <div class="col-12 text-end"><button type="submit" class="btn btn-danger" style="background-color: #f53d2d;">Save Changes</button></div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/profile.js"></script>
    <script>
        // Add logout functionality here since it's on this page too
        document.getElementById('customer-logout-btn').addEventListener('click', () => {
            localStorage.removeItem('customer');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('cart');
            window.location.href = '/';
        });
    </script>
</body>
</html>
