<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css"> <!-- Gigamit na ang bag-ong login.css -->
</head>
<body>
    <div class="login-container">
        <h1>Customer Signup</h1>
        <p class="form-description">Create an account to start shopping.</p>
        <form id="signup-form">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="tel" name="phone" placeholder="Phone Number">
            <input type="text" name="address" placeholder="Address">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="button">Sign Up</button>
        </form>
        <p id="signup-message"></p>
        <p class="form-footer">Already have an account? <a href="/login.html">Login here</a>.</p>
    </div>
    <script src="/signup.js"></script>
</body>
</html>
