<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css"> <!-- Gigamit na ang bag-ong login.css -->
</head>
<body>
    <div class="login-container">
        <h1>Customer Login</h1>
        <p class="form-description">Enter your credentials to access your account.</p>
        <form id="customer-login-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="button">Login</button>
        </form>
        <p id="login-message"></p>
        <p class="form-footer">Don't have an account? <a href="/signup.html">Sign up here</a>.</p>
    </div>

    <script src="/login.js"></script>
</body>
</html>
