<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css"> <!-- Giilisan ang CSS file -->
</head>
<body>
    <div class="login-container"> <!-- Giilisan ang class name -->
        <h1>Admin Login</h1>
        <p class="form-description">Enter your credentials to access the dashboard.</p>
        <form id="admin-login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="button">Login</button>
        </form>
        <p id="error-message" style="color: red;"></p>
        <p class="form-footer">Need to create an admin account? <a href="/admin_signup.html">Sign up here</a>.</p>
    </div>
    <script src="/admin_login.js"></script>
</body>
</html>
