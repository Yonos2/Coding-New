<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NEGOSYO KO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f5f5f5; }
        .table > :not(caption) > * > * {
            padding: 1rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(-180deg, #f53d2d, #f63);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/customer.html">NEGOSYO KO</a>
            <div class="d-flex align-items-center">
                <a href="/orders.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-bag-check"></i> My Purchases
                </a>
                <a href="/cart.html" class="btn btn-outline-light active me-2">
                    <i class="bi bi-cart"></i> Cart
                </a>
                <a href="/profile.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-person-circle"></i> Profile
                </a>
                <button id="customer-logout-btn" class="btn btn-light">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <h2 class="mb-4">My Shopping Cart</h2>
        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead>
                            <tbody id="cart-items-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Payment Method</h5>
                        <div id="payment-options"><div class="form-check"><input class="form-check-input" type="radio" name="payment" id="payment_cod" value="Cash on Delivery" checked><label class="form-check-label" for="payment_cod">Cash on Delivery</label></div><div class="form-check"><input class="form-check-input" type="radio" name="payment" id="payment_gcash" value="GCash"><label class="form-check-label" for="payment_gcash">GCash</label></div></div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center"><h5 class="mb-0">Total</h5><h5 id="cart-total" class="mb-0 fw-bold" style="color: #f53d2d;">₱0.00</h5></div>
                        <div class="d-grid mt-3"><button id="checkout-btn" class="btn btn-danger btn-lg" style="background-color: #f53d2d;">Checkout</button></div>
                    </div>
                </div>
                 <div class="text-center mt-3"><a href="/customer.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> or Continue Shopping</a></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/cart.js"></script>
    <script>
        // Add logout functionality here
        document.getElementById('customer-logout-btn').addEventListener('click', () => {
            localStorage.removeItem('customer');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('cart');
            window.location.href = '/';
        });
    </script>
</body>
</html>
